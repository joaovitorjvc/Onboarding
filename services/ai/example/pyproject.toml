[project]
name = "nuagehub-ai-example"
version = "0.1.0"
description = "Módulo de IA de exemplo do NuageHub."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.120.0",
  "httpx==0.28.1",
  "nuagehub-contracts",
  "pydantic==2.12.5",
  "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
  "hypothesis==6.148.7",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.13.1",
]

[tool.uv.sources]
nuagehub-contracts = { path = "../../../packages/contracts/python", editable = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example"]
