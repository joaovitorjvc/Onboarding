pre-commit:
  parallel: true
  commands:
    prettier:
      run: pnpm exec prettier --check {staged_files}
      glob: '*.{ts,tsx,js,mjs,json,md,css,yml,yaml}'
      exclude:
        - index.html
        - primeiros-passos.html
        - plataformas.html
        - playbook.html
        - css/**
        - js/**
    eslint:
      run: pnpm exec eslint {staged_files}
      glob: '*.{ts,tsx,js,mjs}'
      exclude:
        - index.html
        - primeiros-passos.html
        - plataformas.html
        - playbook.html
        - css/**
        - js/**
    ruff-format:
      run: uvx ruff@0.13.1 format --check --force-exclude {staged_files}
      glob: '*.py'
      exclude:
        - index.html
        - primeiros-passos.html
        - plataformas.html
        - playbook.html
        - css/**
        - js/**
    ruff-check:
      run: uvx ruff@0.13.1 check --force-exclude {staged_files}
      glob: '*.py'
      exclude:
        - index.html
        - primeiros-passos.html
        - plataformas.html
        - playbook.html
        - css/**
        - js/**

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
      exclude:
        - index.html
        - primeiros-passos.html
        - plataformas.html
        - playbook.html
        - css/**
        - js/**
