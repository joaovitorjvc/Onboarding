[project]
name = "nuagehub-contracts"
version = "0.1.0"
description = "Contratos Python compartilhados do NuageHub."
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic==2.12.5",
]

[dependency-groups]
dev = [
  "datamodel-code-generator==0.36.0",
  "hypothesis==6.148.7",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.13.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nuagehub_contracts"]
